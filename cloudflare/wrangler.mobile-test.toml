# Test-only deployment target. Keep this separate from wrangler.toml, which is production.
name = "yourdramalist-mobile-test"
main = "dist/worker.js"
no_bundle = true
account_id = "237eb07bd074765796da94d428949daf"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "ydl-mobile-test"
database_id = "b403fecc-2b9f-4181-8fba-416449ef1341"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "ydl-mobile-test"
