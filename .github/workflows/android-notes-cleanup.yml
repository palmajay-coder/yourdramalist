name: Android release notes cleanup (one time)
# Removes the install instructions (and signing key notes) from every GitHub release's notes. New releases no longer add them
# (mobile/release-notes.sh). Nothing else in the notes changes and nothing is deleted.
# Safe to run again: releases without install instructions are skipped.
on:
  push:
    branches: [migration/cloudflare]
    paths: ['.github/workflows/android-notes-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove install instructions from the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        shell: python3 {0}
        run: |
          import json, os, re, subprocess
          repo = os.environ["R"]
          NOTES_1_1_25 = """## What's new in 1.1.25

          - One search for everything: find dramas, movies, actors, and directors in one bar.
          - Richer title previews: artwork, story, cast, MyDramaList rating, and reviews.
          - My Collections: build your own catalogs from single titles and install them in Nuvio.
          - Update notice: the app tells you when a newer version is out.
          """.replace("\n          ", "\n")
          def api(*args, data=None):
              out = subprocess.run(["gh", "api", *args] + (["--input", "-"] if data is not None else []),
                                   input=json.dumps(data) if data is not None else None,
                                   capture_output=True, text=True, check=True).stdout
              return json.loads(out) if out.strip() else None
          releases = api("--paginate", "--slurp", f"repos/{repo}/releases?per_page=100")
          releases = [r for page in releases for r in page]
          for r in releases:
              body = r.get("body") or ""
              new = body.replace("\r\n", "\n")
              # 1.1.26 and later: a "## Install" section at the end.
              new = re.split(r"\n+## Install\n", new)[0]
              # 1.1.25: the notes were only an install line, so they get its What's new from CHANGELOG.md.
              if new.startswith(("Download YourDramaList-1.1.25-android.apk", "Signed with the permanent YourDramaList key")):
                  new = NOTES_1_1_25
              # 1.1.23 beta: an "Install on Android" section before "Add your catalogs to Nuvio".
              new = re.sub(r"^Install on Android\n.*?(?=^Add your catalogs to Nuvio)", "", new, flags=re.S | re.M)
              # 1.1.23 beta: the APK checksum at the end.
              new = re.sub(r"\n+APK SHA-256\n.*$", "", new, flags=re.S)
              new = new.rstrip() + "\n"
              if new.strip() == body.replace("\r\n", "\n").strip():
                  print("unchanged:", r["tag_name"])
                  continue
              api("-X", "PATCH", f"repos/{repo}/releases/{r['id']}", data={"body": new})
              print("cleaned:", r["tag_name"])
