name: Android release names (one time)
# Gives the 1.1.25, 1.1.26 and 1.1.27 releases the same title and file names as 1.1.23 and 1.1.24:
# title "YourDramaList 1.1.27", file YourDramaList-1.1.27-android.apk. Nothing is deleted.
# Their tags stay android-v1.1.25 to android-v1.1.27; releases from 1.1.28 on are tagged v<version>.
# Safe to run again: releases that already have the new names are skipped.
on:
  push:
    branches: [migration/cloudflare, main]
    paths: ['.github/workflows/android-rename.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rename the releases
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -euxo pipefail
          for v in 1.1.25 1.1.26 1.1.27; do
            apk="YourDramaList-$v-android.apk"
            tag="v$v"; gh api "repos/$R/releases/tags/$tag" > /dev/null 2>&1 || tag="android-v$v"
            id=$(gh api "repos/$R/releases/tags/$tag" -q .id)
            asset=$(gh api "repos/$R/releases/$id" -q '.assets[] | select(.name == "YourDramaList.apk") | .id')
            [[ -z "$asset" ]] || gh api -X PATCH "repos/$R/releases/assets/$asset" -f name="$apk" > /dev/null
            gh api "repos/$R/releases/$id" -q .body | sed "s/YourDramaList\.apk/$apk/g" > "$RUNNER_TEMP/body.md"
            # GitHub does not let workflows add tags to older commits, so these three keep their android-v tags.
            gh api -X PATCH "repos/$R/releases/$id" -f name="YourDramaList $v" -F body=@"$RUNNER_TEMP/body.md" > /dev/null
            echo "$v: title \"YourDramaList $v\", file $apk, tag $tag"
          done
          gh api "repos/$R/releases/latest" -q '"Latest: \(.tag_name) \(.name) \(.assets | map(.name) | join(", "))"'
