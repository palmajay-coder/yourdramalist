name: Android app release
# Builds the Android app, signs it with the permanent YourDramaList release key, and publishes it as a
# GitHub release. Every release must use that same key, or phones refuse to install it as an update.
# It runs when mobile/android-version.txt changes (put the new version there, for example 1.1.25), or
# from the Actions tab once this file is on the default branch.
on:
  push:
    branches: [migration/cloudflare, main]
    paths: ['mobile/android-version.txt']
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, for example 1.1.25 (leave empty to use mobile/android-version.txt)"
        required: false
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # SHA-256 of the release key's certificate. A build signed with any other key is refused.
      RELEASE_CERT_SHA256: 31f302187e76b4110fe71bd261936e099d9c195e935a142ad997ebc741c68a63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the version and the release key
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.YDL_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YDL_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          VERSION="${INPUT_VERSION:-$(tr -d '[:space:]' < mobile/android-version.txt)}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Enter a version like 1.1.25"; exit 1; }
          for tag in "v$VERSION" "android-v$VERSION"; do if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "$VERSION is already released ($tag). Raise the version."; exit 1; fi; done
          echo "APK=YourDramaList-$VERSION-android.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]] || { echo "Add the YDL_RELEASE_KEYSTORE_BASE64 and YDL_RELEASE_KEYSTORE_PASSWORD secrets first (see mobile/README.md)."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Install Android build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "build-tools;36.0.0" "platforms;android-36" > /dev/null
      - name: Build and sign the app
        env:
          YDL_RELEASE: "1"
          YDL_KEYSTORE_PASSWORD: ${{ secrets.YDL_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          # Version codes only go up: 100 plus this workflow's run number.
          export JAVA_HOME="$JAVA_HOME_17_X64" YDL_KEYSTORE="$RUNNER_TEMP/release.jks"
          export YDL_VERSION_NAME="$VERSION" YDL_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          bash mobile/android-test/build.sh "$RUNNER_TEMP/$APK"
          signer=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          [[ "$signer" == "$RELEASE_CERT_SHA256" ]] || { echo "Signed with an unexpected key: $signer"; exit 1; }
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$YDL_VERSION_CODE" "$VERSION" > "$RUNNER_TEMP/android-latest.json"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same feature list as the app's What's new dialog (mobile/whats-new.md).
          bash mobile/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          # Names match the earlier releases: tag v1.1.27, title "YourDramaList 1.1.27",
          # file YourDramaList-1.1.27-android.apk.
          gh release create "v$VERSION" "$RUNNER_TEMP/$APK" "$RUNNER_TEMP/android-latest.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "YourDramaList $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
