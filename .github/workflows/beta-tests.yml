name: YourDramaList beta checks
on:
  push:
    paths: ['*.ts', '*.css', '*.json', 'tests/**', '.github/workflows/beta-tests.yml']
  pull_request:
    paths: ['*.ts', '*.css', '*.json', 'tests/**', '.github/workflows/beta-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan the publication for known secrets/private captures
        run: node tests/audit-release.mjs
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.8
      - name: Run offline assertion suites with test-only Val Town adapters
        run: deno run --no-check --allow-read --allow-env --import-map=tests/import_map.json tests/run-tests.ts
