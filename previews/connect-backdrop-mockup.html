<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YourDramaList Backdrop Mockup</title><style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:white;font:16px system-ui}.tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px;background:#202432}.tools button{background:#2878eb;border:0;color:white;padding:10px 15px;border-radius:20px;cursor:pointer}input{accent-color:#2878eb}.stage{display:flex;justify-content:center;padding:20px}.frame{width:390px;height:844px;position:relative;overflow:hidden;border:1px solid #434957;border-radius:24px;background:#111}.frame.wide{width:min(1440px,100%);height:900px}.wall{position:absolute;inset:0;display:grid;grid-template-rows:repeat(4,1fr);gap:10px;padding:10px}.wide .wall{grid-template-rows:repeat(3,1fr)}.track{display:flex;gap:10px;width:max-content;height:100%;animation:move var(--speed) linear infinite}.set{display:flex;gap:10px;height:100%}.tile{height:100%;aspect-ratio:16/9;overflow:hidden;border-radius:11px;background:linear-gradient(120deg,#34435b,#594053);display:grid;place-items:center;text-align:center;font-size:12px;color:#c6cbd8}.tile img{height:100%;width:100%;object-fit:cover;grid-area:1/1}.tile span{grid-area:1/1}.track:nth-child(even){margin-left:-110px}@keyframes move{from{transform:translateX(-50%)}to{transform:translateX(0)}}.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(10,12,16,var(--tint,.74)),rgba(10,12,16,.93));pointer-events:none}.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px 20px 100px;gap:16px}h1{font-size:clamp(34px,6vw,60px);letter-spacing:-1.5px;margin:0}.panel{width:100%;max-width:510px;padding:24px 18px;border:1px solid #444954;border-radius:18px;background:#20232bcc;display:grid;gap:13px}.panel input{background:#28292e;border:1px solid #444954;border-radius:10px;color:white;padding:17px;font:inherit;min-width:0}.panel button,.continue{border:0;border-radius:10px;background:#2878eb;color:white;padding:17px;font:600 16px system-ui}.continue{width:100%;max-width:510px;background:#20232bbb;border:1px solid #444954;font-weight:400}.nav{position:absolute;bottom:0;left:0;right:0;background:#1e222e;height:76px;display:flex;justify-content:space-around;align-items:center;font-size:12px;color:#c5cbd5}.nav b{color:white;background:#2878eb;border-radius:20px;padding:10px}@media(prefers-reduced-motion:reduce){.track{animation:none;transform:none}}@media(max-width:500px){.stage{padding:8px}.frame{width:min(390px,100%)}} </style>
<div class="tools"><strong>YDL · Backdrop preview</strong><button id="phone">Phone 390×844</button><button id="wide">Wide 1440×900</button><label>Tint <output id="out">74%</output> <input id="tint" type="range" min="45" max="95" value="74"></label><button id="shuffle">Shuffle</button></div>

<script>
// Standalone visual study. Replace sample paths with verified K-drama TMDB backdrop_path values.
const paths=['/tsRy63Mu5cu8etL1X7ZLyf7UP1M.jpg','/9xxLWtnFxkpJ2h1uthpvCRK6vta.jpg','/6Lw54zxm6BAEKJeGlabyzzR5Juu.jpg','/nGzg3mn3C6fYVE0SvXHmY2XX4P2.jpg','/hNFMawyNDWZKKHU4GYCBz1krsRM.jpg','/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg','/nBNZadXqJSdt05SHLqgT0HuC5Gm.jpg','/2lECpi35Hnbpa4y46JX0aY3AWTy.jpg','/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg'];const frame=document.getElementById('frame'),wall=document.getElementById('wall');function random(a){return [...a].sort(()=>Math.random()-.5)}function draw(){wall.innerHTML='';for(let i=0;i<(frame.classList.contains('wide')?3:4);i++){let track=document.createElement('div');track.className='track';track.style.setProperty('--speed',(500+i*52)+'s');let set=document.createElement('div');set.className='set';random(paths).forEach((p,j)=>{let tile=document.createElement('div');tile.className='tile';let label=document.createElement('span');label.textContent='Scene '+(j+1);let img=document.createElement('img');img.src='https://image.tmdb.org/t/p/w780'+p;img.alt='';img.onerror=()=>img.remove();tile.append(label,img);set.append(tile)});track.append(set,set.cloneNode(true));wall.append(track)}}document.getElementById('phone').onclick=()=>{frame.classList.remove('wide');draw()};document.getElementById('wide').onclick=()=>{frame.classList.add('wide');draw()};document.getElementById('shuffle').onclick=draw;document.getElementById('tint').oninput=e=>{frame.style.setProperty('--tint',e.target.value/100);document.getElementById('out').textContent=e.target.value+'%'};draw();
